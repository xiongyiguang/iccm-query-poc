<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iCCM · 本机智能体</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">iCCM <span>智能体演示</span></div><div class="badge">仅本机 · 只读数据</div><div id="connection" role="status">连接中…</div></header>
<div class="layout"><aside><label class="model-label" for="model-choice">新对话模型 · 低推理</label><select id="model-choice"><option value="gpt-6-luna">GPT-6 Luna · 快速</option><option value="gpt-6-sol" selected>GPT-6 Sol · 均衡</option><option value="gpt-6-astra">GPT-6 Astra · 复杂问题</option></select><button id="new" class="new">＋ 新对话</button><div class="label">本次演示对话</div><nav id="sessions"></nav><div class="aside-bottom"><div class="label">当前数据快照</div><div id="counts"></div><div class="runtime">Codex App Server<br><span id="model">使用本机已登录账号</span></div></div></aside>
<main><div id="conversation" aria-live="polite"><section id="welcome"><p class="eyebrow">从问题出发，沿数据关系查证</p><h1>直接提问，<br><span>看见查询的每一步。</span></h1><p>智能体理解问题并调用只读工具。数量来自真实查询，过程与原始依据可以展开查看。</p><div class="suggestions"><button data-question="XJ3ABC002RR 下的设备类描述3727下的部件有多少类？">查询现场部件类别 <span>↗</span></button><button data-question="PBS、构型和设备类有什么区别？">了解数据概念 <span>↗</span></button><button data-question="筛选测量值大于50且小于80摄氏度的测点。">按条件筛选测点 <span>↗</span></button></div></section></div>
<footer><div id="notice" role="status">与 r10 独立运行 · 数据为导入快照</div><form id="form"><textarea id="question" rows="2" placeholder="输入问题；Enter 发送，Shift+Enter 换行" aria-label="问题"></textarea><div class="composer-bottom"><span id="activity">先核查，再回答</span><button id="stop" type="button" hidden>停止</button><button id="send" type="submit" disabled>发送 ↑</button></div></form><small>展示系统准备、查询思路及实际工具过程；有歧义时会向你确认。</small></footer></main></div><script src="/app.js"></script></body></html>
