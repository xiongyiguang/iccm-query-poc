<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · iCCM 智能问数</title><link rel="stylesheet" href="/login.css"></head>
<body><header><a href="/login" class="brand">iCCM <span>智能问数</span></a><span class="environment">设备数据问答演示</span></header>
<main><section class="intro" aria-labelledby="introTitle"><p class="eyebrow">让每个答案有据可查</p><h1 id="introTitle">从设备关系出发，<br>用自然语言查数据。</h1><p class="description">连接现场对象、构型与测点数据，<br>在提问与追问中，找到有依据的答案。</p><div class="relations" aria-label="可查询的数据对象"><div class="relation-top"><span>PBS 现场对象</span><i>关联</i><span>构型</span></div><div class="relation-bottom"><span>设备与部件分类</span><span>测点与报警记录</span></div></div><p class="intro-foot">对象定位 · 关系追溯 · 分类统计 · 测点查询</p></section>
<section class="panel" aria-labelledby="loginTitle"><div class="panel-inner"><p class="welcome">欢迎使用</p><h2 id="loginTitle">登录工作空间</h2><p class="hint">使用演示账号，开始探索设备数据。</p><form id="loginForm"><label for="username">账号</label><input id="username" name="username" autocomplete="username" placeholder="请输入账号" maxlength="100" required><div class="password-label"><label for="password">密码</label></div><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="512" required><button id="togglePassword" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div><p id="error" class="error" role="alert" aria-live="polite"></p><button id="submit" class="primary" type="submit">登录并进入</button></form><p class="help">账号或密码如需调整，请联系演示管理员。</p></div></section></main><footer>iCCM 智能问数 · 演示环境</footer><script src="/login.js"></script></body></html>
